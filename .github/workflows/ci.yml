name: CI

on:
    push:
        branches: ["**"]
    pull_request:
        branches: [main]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        name: Typecheck, lint, test
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Lint
              run: npx biome ci .

            - name: Test
              run: npm test -- --ci
